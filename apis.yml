name: HelperGo
description: HelperGo is a Hong Kong-based on-demand home services marketplace that connects households
  with more than 5,000 vetted local helpers for domestic cleaning, air-conditioning and window cleaning,
  cooking, childcare and babysitting, postnatal doula and confinement care, elderly and nursing care,
  and medical escort services. Customers book through the HelperGo iOS and Android apps or the website,
  with instant helper matching, ratings and reviews, and a satisfaction guarantee. HelperGo is a
  portfolio company of 500 Global and operates across Hong Kong and Singapore. The company is a
  consumer-facing service marketplace and publishes no public developer API surface at this time.
